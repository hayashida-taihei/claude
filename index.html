<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDFテキスト抽出アプリ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .upload-section {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            background: #f8f9ff;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .upload-section:hover {
            background: #eef1ff;
            border-color: #764ba2;
        }

        .upload-section.dragover {
            background: #e0e7ff;
            border-color: #764ba2;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .upload-section h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .upload-section p {
            color: #666;
            margin-bottom: 20px;
        }

        #fileInput {
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        .file-info {
            margin-top: 20px;
            padding: 15px;
            background: #e0e7ff;
            border-radius: 10px;
            display: none;
        }

        .file-info.show {
            display: block;
        }

        .file-info h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .loading {
            display: none;
            margin-top: 20px;
            text-align: center;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-section {
            margin-top: 30px;
            display: none;
        }

        .result-section.show {
            display: block;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .result-header h2 {
            color: #333;
        }

        .btn-small {
            padding: 10px 25px;
            font-size: 0.9em;
        }

        .text-output {
            background: #f8f9ff;
            border: 2px solid #667eea;
            border-radius: 10px;
            padding: 25px;
            max-height: 500px;
            overflow-y: auto;
            line-height: 1.8;
            color: #333;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .text-output::-webkit-scrollbar {
            width: 10px;
        }

        .text-output::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .text-output::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .text-output::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: #f8f9ff;
            padding: 15px 25px;
            border-radius: 10px;
            flex: 1;
            min-width: 150px;
            text-align: center;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .stat-value {
            color: #667eea;
            font-size: 1.5em;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .content {
                padding: 20px;
            }

            .upload-section {
                padding: 30px 20px;
            }

            .stats {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📄 PDFテキスト抽出</h1>
            <p>PDFファイルをアップロードして、テキストを簡単に抽出できます</p>
        </div>

        <div class="content">
            <div class="upload-section" id="dropZone">
                <div class="upload-icon">📁</div>
                <h2>PDFファイルを選択</h2>
                <p>クリックしてファイルを選択、またはドラッグ＆ドロップ</p>
                <input type="file" id="fileInput" accept=".pdf">
                <button class="btn" onclick="document.getElementById('fileInput').click()">
                    ファイルを選択
                </button>
            </div>

            <div class="file-info" id="fileInfo">
                <h3>📎 選択されたファイル</h3>
                <p id="fileName"></p>
                <button class="btn btn-small" id="extractBtn" onclick="extractText()">
                    テキストを抽出
                </button>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>PDFを処理中...</p>
            </div>

            <div class="result-section" id="resultSection">
                <div class="result-header">
                    <h2>✨ 抽出結果</h2>
                    <button class="btn btn-small" onclick="copyToClipboard()">
                        📋 コピー
                    </button>
                </div>

                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-label">ページ数</div>
                        <div class="stat-value" id="pageCount">-</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">文字数</div>
                        <div class="stat-value" id="charCount">-</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">単語数</div>
                        <div class="stat-value" id="wordCount">-</div>
                    </div>
                </div>

                <div class="text-output" id="textOutput"></div>
            </div>
        </div>
    </div>

    <script>
        // PDF.jsの設定
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let selectedFile = null;

        // ファイル入力の変更イベント
        document.getElementById('fileInput').addEventListener('change', handleFileSelect);

        // ドラッグ＆ドロップのイベント
        const dropZone = document.getElementById('dropZone');

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');

            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].type === 'application/pdf') {
                const input = document.getElementById('fileInput');
                input.files = files;
                handleFileSelect({ target: input });
            } else {
                alert('PDFファイルを選択してください。');
            }
        });

        // ファイル選択処理
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.type !== 'application/pdf') {
                alert('PDFファイルを選択してください。');
                return;
            }

            selectedFile = file;
            const fileInfo = document.getElementById('fileInfo');
            const fileName = document.getElementById('fileName');

            fileName.textContent = `${file.name} (${formatFileSize(file.size)})`;
            fileInfo.classList.add('show');

            // 結果セクションを非表示
            document.getElementById('resultSection').classList.remove('show');
        }

        // ファイルサイズのフォーマット
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        // テキスト抽出処理
        async function extractText() {
            if (!selectedFile) return;

            // UI更新
            document.getElementById('loading').classList.add('show');
            document.getElementById('extractBtn').disabled = true;
            document.getElementById('resultSection').classList.remove('show');

            try {
                const arrayBuffer = await selectedFile.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

                let fullText = '';
                const numPages = pdf.numPages;

                // 各ページからテキストを抽出
                for (let i = 1; i <= numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    const pageText = textContent.items.map(item => item.str).join(' ');
                    fullText += pageText + '\n\n';
                }

                // 結果を表示
                displayResult(fullText, numPages);

            } catch (error) {
                console.error('PDF処理エラー:', error);
                alert('PDFの処理中にエラーが発生しました。\n' + error.message);
            } finally {
                document.getElementById('loading').classList.remove('show');
                document.getElementById('extractBtn').disabled = false;
            }
        }

        // 結果の表示
        function displayResult(text, pageCount) {
            // 統計情報の計算
            const charCount = text.length;
            const wordCount = text.trim().split(/\s+/).filter(word => word.length > 0).length;

            // UI更新
            document.getElementById('pageCount').textContent = pageCount;
            document.getElementById('charCount').textContent = charCount.toLocaleString();
            document.getElementById('wordCount').textContent = wordCount.toLocaleString();
            document.getElementById('textOutput').textContent = text;
            document.getElementById('resultSection').classList.add('show');

            // 結果セクションまでスクロール
            document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // クリップボードにコピー
        async function copyToClipboard() {
            const text = document.getElementById('textOutput').textContent;

            try {
                await navigator.clipboard.writeText(text);

                // コピー成功のフィードバック
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✓ コピーしました！';
                btn.style.background = '#10b981';

                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.background = '';
                }, 2000);
            } catch (error) {
                console.error('コピーエラー:', error);
                alert('クリップボードへのコピーに失敗しました。');
            }
        }
    </script>
</body>
</html>
