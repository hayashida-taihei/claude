<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タイピングゲーム</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #000;
            font-family: 'Courier New', monospace;
        }

        #gameContainer {
            text-align: center;
        }

        canvas {
            border: 2px solid #0f0;
            background: #000;
            display: block;
            margin: 0 auto;
        }

        #stats {
            display: flex;
            justify-content: space-around;
            color: #0f0;
            font-size: 20px;
            margin: 20px 0;
            text-shadow: 0 0 10px #0f0;
        }

        #inputField {
            background: #000;
            border: 2px solid #0f0;
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 24px;
            padding: 10px;
            text-align: center;
            width: 400px;
            margin: 20px auto;
            display: block;
            outline: none;
            text-shadow: 0 0 5px #0f0;
        }

        #inputField:focus {
            border-color: #0ff;
            box-shadow: 0 0 10px #0ff;
        }

        #gameOver {
            color: #f00;
            font-size: 48px;
            margin: 20px 0;
            text-shadow: 0 0 20px #f00;
            display: none;
        }

        #instructions {
            color: #0f0;
            font-size: 16px;
            margin: 10px 0;
        }

        .stat-item {
            margin: 0 10px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="stats">
            <div class="stat-item">スコア: <span id="score">0</span></div>
            <div class="stat-item">ライフ: <span id="lives">❤❤❤</span></div>
            <div class="stat-item">正確性: <span id="accuracy">100</span>%</div>
            <div class="stat-item">レベル: <span id="level">1</span></div>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <input type="text" id="inputField" placeholder="単語を入力..." autocomplete="off">
        <div id="gameOver">ゲームオーバー</div>
        <div id="instructions">単語を素早く入力してください | R: リスタート</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const accuracyElement = document.getElementById('accuracy');
        const levelElement = document.getElementById('level');
        const gameOverElement = document.getElementById('gameOver');
        const inputField = document.getElementById('inputField');

        // ゲーム状態
        let gameState = {
            running: true,
            score: 0,
            lives: 3,
            level: 1,
            totalTyped: 0,
            correctTyped: 0,
            wordsCompleted: 0
        };

        // 単語リスト（日本語とローマ字のバリエーション）
        const wordLists = {
            easy: ['cat', 'dog', 'run', 'jump', 'sun', 'moon', 'star', 'tree', 'sea', 'sky'],
            medium: ['apple', 'tiger', 'river', 'cloud', 'happy', 'smile', 'music', 'dance', 'dream', 'peace'],
            hard: ['computer', 'javascript', 'rainbow', 'keyboard', 'mountain', 'butterfly', 'adventure', 'fantastic', 'chocolate', 'challenge'],
            expert: ['programming', 'development', 'extraordinary', 'international', 'congratulations', 'understanding', 'communication', 'entertainment', 'appreciation', 'responsibility']
        };

        // 降ってくる単語
        let fallingWords = [];
        let wordSpeed = 0.5;
        let spawnRate = 0.01;

        // 現在の単語リスト
        function getCurrentWordList() {
            if (gameState.level <= 2) return wordLists.easy;
            if (gameState.level <= 4) return wordLists.medium;
            if (gameState.level <= 7) return wordLists.hard;
            return wordLists.expert;
        }

        // ランダムな単語を生成
        function createFallingWord() {
            const words = getCurrentWordList();
            const word = words[Math.floor(Math.random() * words.length)];

            fallingWords.push({
                text: word,
                x: Math.random() * (canvas.width - 150) + 50,
                y: 0,
                speed: wordSpeed,
                color: `hsl(${Math.random() * 360}, 100%, 50%)`
            });
        }

        // ゲームの初期化
        function initGame() {
            fallingWords = [];
            gameState.score = 0;
            gameState.lives = 3;
            gameState.level = 1;
            gameState.running = true;
            gameState.totalTyped = 0;
            gameState.correctTyped = 0;
            gameState.wordsCompleted = 0;
            wordSpeed = 0.5;
            spawnRate = 0.01;
            inputField.value = '';
            inputField.disabled = false;
            gameOverElement.style.display = 'none';
            updateStats();
            inputField.focus();
        }

        // 統計の更新
        function updateStats() {
            scoreElement.textContent = gameState.score;

            // ライフ表示
            let heartsDisplay = '';
            for (let i = 0; i < gameState.lives; i++) {
                heartsDisplay += '❤';
            }
            livesElement.textContent = heartsDisplay || '💀';

            // 正確性計算
            const accuracy = gameState.totalTyped > 0
                ? Math.round((gameState.correctTyped / gameState.totalTyped) * 100)
                : 100;
            accuracyElement.textContent = accuracy;

            levelElement.textContent = gameState.level;
        }

        // 降ってくる単語の描画
        function drawFallingWords() {
            ctx.font = '24px "Courier New"';

            fallingWords.forEach(word => {
                // 単語の影
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillText(word.text, word.x + 2, word.y + 2);

                // 単語本体
                ctx.fillStyle = word.color;
                ctx.fillText(word.text, word.x, word.y);

                // 単語の枠
                ctx.strokeStyle = word.color;
                ctx.lineWidth = 1;
                const textWidth = ctx.measureText(word.text).width;
                ctx.strokeRect(word.x - 5, word.y - 25, textWidth + 10, 30);
            });
        }

        // 背景のグリッド描画
        function drawBackground() {
            ctx.strokeStyle = 'rgba(0, 255, 0, 0.1)';
            ctx.lineWidth = 1;

            // 縦線
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }

            // 横線
            for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // 危険ゾーン（下部）
            ctx.fillStyle = 'rgba(255, 0, 0, 0.1)';
            ctx.fillRect(0, canvas.height - 50, canvas.width, 50);
            ctx.strokeStyle = '#f00';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - 50);
            ctx.lineTo(canvas.width, canvas.height - 50);
            ctx.stroke();
        }

        // 単語の更新
        function updateFallingWords() {
            // 新しい単語の生成
            if (Math.random() < spawnRate && fallingWords.length < 8) {
                createFallingWord();
            }

            // 単語を下に移動
            fallingWords = fallingWords.filter(word => {
                word.y += word.speed;

                // 画面下に到達した場合
                if (word.y > canvas.height - 30) {
                    gameState.lives--;
                    updateStats();

                    if (gameState.lives <= 0) {
                        gameState.running = false;
                    }

                    return false; // 単語を削除
                }

                return true;
            });
        }

        // 入力チェック
        function checkInput() {
            const input = inputField.value.trim().toLowerCase();

            if (input === '') return;

            let found = false;

            // 入力された単語と一致する降ってくる単語を探す
            for (let i = 0; i < fallingWords.length; i++) {
                if (fallingWords[i].text.toLowerCase() === input) {
                    // 正解！
                    found = true;

                    // スコア加算（高い位置にある単語ほど高得点）
                    const heightBonus = Math.floor((canvas.height - fallingWords[i].y) / 10);
                    const levelBonus = gameState.level * 5;
                    const wordLengthBonus = fallingWords[i].text.length * 2;
                    gameState.score += 10 + heightBonus + levelBonus + wordLengthBonus;

                    // 統計更新
                    gameState.wordsCompleted++;
                    gameState.correctTyped += input.length;

                    // 単語を削除
                    fallingWords.splice(i, 1);

                    // レベルアップチェック
                    if (gameState.wordsCompleted % 10 === 0) {
                        gameState.level++;
                        wordSpeed += 0.2;
                        spawnRate += 0.002;
                    }

                    break;
                }
            }

            // 入力をクリア
            if (found) {
                inputField.value = '';
            }

            updateStats();
        }

        // 粒子エフェクト（オプション：ボーナス演出用）
        let particles = [];

        function createParticles(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    life: 1.0,
                    color: color
                });
            }
        }

        function updateParticles() {
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                return p.life > 0;
            });
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.fillStyle = p.color.replace(')', `, ${p.life})`).replace('hsl', 'hsla');
                ctx.fillRect(p.x, p.y, 3, 3);
            });
        }

        // ゲームループ
        function gameLoop() {
            // 画面をクリア
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 背景描画
            drawBackground();

            if (gameState.running) {
                updateFallingWords();
                updateParticles();
            } else {
                gameOverElement.style.display = 'block';
                inputField.disabled = true;
            }

            drawFallingWords();
            drawParticles();

            requestAnimationFrame(gameLoop);
        }

        // 入力イベント
        inputField.addEventListener('input', () => {
            if (gameState.running) {
                gameState.totalTyped++;
                checkInput();
            }
        });

        // キーボードイベント
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                initGame();
            }
        });

        // ゲームの開始
        initGame();
        gameLoop();
        inputField.focus();
    </script>
</body>
</html>
